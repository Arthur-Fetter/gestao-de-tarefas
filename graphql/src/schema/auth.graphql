type AuthPayload {
  token: String!
  user: AuthUser!
}

type AuthUser {
  id: String!
  email: String!
  name: String!
  role: String!
}

type Query {
  me: AuthUser
}

type Mutation {
  register(name: String!, email: String!, password: String!, role: String): AuthPayload!
  login(email: String!, password: String!): AuthPayload!
}
