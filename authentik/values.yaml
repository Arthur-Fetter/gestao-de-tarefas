# Authentik Helm chart values for local k3d development
# Chart: https://charts.goauthentik.io
# Docs: https://docs.goauthentik.io/docs/install-config/install/kubernetes

authentik:
  secret_key: "dev-only-secret-key-change-in-production"
  error_reporting:
    enabled: false
  postgresql:
    password: "dev-postgres-password"

server:
  ingress:
    ingressClassName: traefik
    enabled: true
    hosts:
      - authentik.localhost

postgresql:
  enabled: true
  auth:
    password: "dev-postgres-password"

redis:
  enabled: true
