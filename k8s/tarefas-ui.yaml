apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarefas-ui
  namespace: default
  labels:
    app: tarefas-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tarefas-ui
  template:
    metadata:
      labels:
        app: tarefas-ui
    spec:
      containers:
        - name: tarefas-ui
          image: tarefas-ui:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: tarefas-ui
  namespace: default
spec:
  selector:
    app: tarefas-ui
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tarefas-ui
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: tarefas-ui.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tarefas-ui
                port:
                  number: 80
